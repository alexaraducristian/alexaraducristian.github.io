  <!-- Subtitle -->
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="13" fill="#aaa" text-anchor="middle" letter-spacing="6" font-weight="700">AUTORIZAT ANRE</text>

  <!-- RCD/breaker icons right side -->
  <rect x="420" y="50" width="14" height="30" rx="2" fill="none" stroke="#FFD600" stroke-width="1.5" />
  <rect x="424" y="54" width="6" height="4" rx="1" fill="#FFD600" />
  <line x1="427" y1="62" x2="427" y2="76" stroke="#FFD600" stroke-width="1.5" />

  <rect x="440" y="50" width="14" height="30" rx="2" fill="none" stroke="#FFD600" stroke-width="1.5" />
  <rect x="444" y="54" width="6" height="4" rx="1" fill="#FFD600" />
  <line x1="447" y1="62" x2="447" y2="76" stroke="#FFD600" stroke-width="1.5" />

  <rect x="460" y="50" width="14" height="30" rx="2" fill="none" stroke="#FFD600" stroke-width="1.5" />
  <rect x="464" y="54" width="6" height="4" rx="1" fill="#FFD600" />
  <line x1="467" y1="62" x2="467" y2="76" stroke="#FFD600" stroke-width="1.5" />

