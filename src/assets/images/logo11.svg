<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004D40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad11b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background for icon -->
  <rect x="15" y="30" width="100" height="100" rx="20" fill="url(#grad11)" />

  <!-- Stylized letter A inside the green square -->
  <path d="M65 45 L40 115 L50 115 L55 100 L75 100 L80 115 L90 115 Z" 
        fill="none" stroke="url(#grad11b)" stroke-width="5" 
        stroke-linejoin="round" stroke-linecap="round" />
  <!-- A crossbar -->
  <line x1="57" y1="92" x2="73" y2="92" stroke="url(#grad11b)" 
        stroke-width="4" stroke-linecap="round" />

  <!-- Text: "lexaVolt" (A is already in the icon) -->
  <text x="130" y="95" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="50" font-weight="900" fill="#004D40" 
        letter-spacing="-1">lexaVolt</text>

  <!-- Separator line -->
  <line x1="130" y1="110" x2="430" y2="110" stroke="#00897B" 
        stroke-width="2" opacity="0.5" />

  <!-- Subtitle -->
  <text x="280" y="145" font-family="Arial, sans-serif" font-size="15" 
        fill="#555" text-anchor="middle" letter-spacing="4" 
        font-weight="600">AUTORIZAT ANRE</text>

  <!-- Small solar panel icon -->
  <rect x="400" y="135" width="30" height="22" rx="2" fill="none" 
        stroke="#004D40" stroke-width="1.5" />
  <line x1="400" y1="142" x2="430" y2="142" stroke="#004D40" stroke-width="1" />
  <line x1="400" y1="149" x2="430" y2="149" stroke="#004D40" stroke-width="1" />
  <line x1="410" y1="135" x2="410" y2="157" stroke="#004D40" stroke-width="1" />
  <line x1="420" y1="135" x2="420" y2="157" stroke="#004D40" stroke-width="1" />

  <!-- Sun rays -->
  <circle cx="415" cy="125" r="3" fill="#FFD600" />
  <line x1="415" y1="118" x2="415" y2="115" stroke="#FFD600" 
        stroke-width="1.5" stroke-linecap="round" />
  <line x1="422" y1="120" x2="424" y2="118" stroke="#FFD600" 
        stroke-width="1.5" stroke-linecap="round" />
  <line x1="408" y1="120" x2="406" y2="118" stroke="#FFD600" 
        stroke-width="1.5" stroke-linecap="round" />
</svg>
