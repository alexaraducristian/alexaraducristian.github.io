<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F57F17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD600;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon with lightning -->
  <polygon points="70,25 115,47 115,93 70,115 25,93 25,47" fill="url(#grad4b)" />
  <path d="M62 45 L52 75 L64 75 L56 105 L88 65 L73 65 L83 45 Z" fill="url(#grad4)" />

  <!-- Text with split color -->
  <text x="135" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">
    <tspan fill="#0D47A1">Alexa</tspan><tspan fill="#F57F17">Volt</tspan>
  </text>

  <!-- Electric circuit line -->
  <path d="M135 105 L200 105 L210 95 L220 115 L230 95 L240 115 L250 105 L450 105" stroke="#0D47A1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtitle -->
  <text x="290" y="145" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle" letter-spacing="6" font-weight="700">AUTORIZAT ANRE</text>

  <!-- Small circuit nodes -->
  <circle cx="135" cy="105" r="4" fill="#F57F17" />
  <circle cx="450" cy="105" r="4" fill="#F57F17" />

  <!-- Wire/cable icon bottom -->
  <path d="M200 165 Q250 175 300 165 Q350 155 400 165" stroke="#bbb" stroke-width="2" fill="none" stroke-dasharray="4 3" />
</svg>
